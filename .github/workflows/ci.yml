name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      # Our own tool. Locks the runner image's tool versions and diffs them when
      # GitHub bumps the image — including when a floating label like
      # ubuntu-latest silently re-points. Report-only; no fail-on yet.
      - name: Runner image drift
        uses: Booyaka101/runner-drift@v1
        with:
          fail-on-retirement: 60
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
